name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Unit tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -q
      - name: Offline smoke run (v2)
        env:
          BENCH_DISABLE_EXTERNAL: "1"
          CPPTAI_DISABLE_EXTERNAL: "1"
          CPPTAI_CACHE_MODE: "offline"
        run: |
          python src/main.py --v2 --offline --no-benchmark
